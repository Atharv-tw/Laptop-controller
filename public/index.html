<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber-Remote</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            background: #0f0f0f;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Swipe Area */
        #gesture-zone {
            flex: 1;
            border: 2px dashed #00ff41;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        /* Terminal Area */
        #terminal {
            height: 40%;
            background: #000;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }

        #output {
            flex: 1;
            overflow-y: auto;
            font-size: 0.9rem;
            margin-bottom: 10px;
            white-space: pre-wrap;
        }

        #input-area {
            display: flex;
            border-top: 1px solid #333;
            padding-top: 10px;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: #00ff41;
            font-family: inherit;
            outline: none;
            font-size: 1rem;
        }

        .prompt { margin-right: 10px; }

        /* Window Switcher CSS */
        #window-switcher {
            margin-bottom: 20px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 10px;
        }

        .window-card {
            display: inline-block;
            width: 120px;
            height: 80px;
            background: #1a1a1a;
            border: 1px solid #00ff41;
            border-radius: 8px;
            margin-right: 10px;
            padding: 10px;
            font-size: 0.7rem;
            vertical-align: top;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: normal;
        }

        /* File Transfer CSS */
        #file-transfer {
            margin-top: 20px;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 10px;
        }

        button {
            background: #00ff41;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        #file-list {
            margin-top: 10px;
            font-size: 0.8rem;
            max-height: 100px;
            overflow-y: auto;
        }

        .file-item {
            padding: 5px 0;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
        }

        .file-item a { color: #00ff41; text-decoration: none; }
    </style>
</head>
<body>

    <div id="gesture-zone">
        Swipe Left/Right<br>to switch apps
    </div>

    <!-- New: Visual Window Switcher -->
    <div id="window-switcher">
        <div id="window-tray"></div>
    </div>

    <div id="terminal">
        <div id="output">Welcome to Cyber-Remote v1.0...
System ready.</div>
        <div id="input-area">
            <span class="prompt">></span>
            <input type="text" id="cmd-input" placeholder="Type command..." autocomplete="off">
        </div>
    </div>

    <!-- New: File Transfer Area -->
    <div id="file-transfer">
        <input type="file" id="file-input" style="display: none">
        <button onclick="document.getElementById('file-input').click()">Upload File</button>
        <div id="file-list"></div>
    </div>

    <script>
        const socket = io();
        const input = document.getElementById('cmd-input');
        const output = document.getElementById('output');
        const zone = document.getElementById('gesture-zone');

        // --- Gestures ---
        let touchStart = 0;
        zone.addEventListener('touchstart', e => {
            touchStart = e.changedTouches[0].screenX;
        });

        zone.addEventListener('touchend', e => {
            let touchEnd = e.changedTouches[0].screenX;
            if (touchEnd < touchStart - 50) socket.emit('switch-app', 'right'); // Swipe Left -> Next
            if (touchEnd > touchStart + 50) socket.emit('switch-app', 'left');  // Swipe Right -> Prev
        });

        // --- Terminal ---
        input.addEventListener('keypress', e => {
            if (e.key === 'Enter') {
                const cmd = input.value;
                output.innerText += '\n> ' + cmd;
                socket.emit('terminal-cmd', cmd);
                input.value = '';
            }
        });

        socket.on('terminal-res', data => {
            output.innerText += '\n' + data;
            output.scrollTop = output.scrollHeight;
        });

        // --- Window Switcher ---
        const tray = document.getElementById('window-tray');
        
        function refreshWindows() {
            socket.emit('get-windows');
        }

        socket.on('windows-list', titles => {
            tray.innerHTML = '';
            titles.forEach(title => {
                const card = document.createElement('div');
                card.className = 'window-card';
                card.innerText = title;
                tray.appendChild(card);
            });
        });

        // Refresh every 5 seconds
        setInterval(refreshWindows, 5000);
        refreshWindows();

        // --- File Transfers ---
        const fileInput = document.getElementById('file-input');
        const fileList = document.getElementById('file-list');

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);

            fetch('/upload', { method: 'POST', body: formData })
                .then(res => res.text())
                .then(msg => {
                    alert(msg);
                    loadFiles();
                });
        });

        function loadFiles() {
            fetch('/files')
                .then(res => res.json())
                .then(files => {
                    fileList.innerHTML = '';
                    files.forEach(file => {
                        const div = document.createElement('div');
                        div.className = 'file-item';
                        div.innerHTML = `<span>${file}</span> <a href="/download/${file}" download>Download</a>`;
                        fileList.appendChild(div);
                    });
                });
        }

        loadFiles();
    </script>
</body>
</html>
